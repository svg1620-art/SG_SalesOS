{# Единая под-навигация модуля Ops. Использование:
   {% from "ops/_nav.html" import ops_nav %}{{ ops_nav('costs') }} #}
{% macro ops_nav(active='') %}
<div class="sg-sm sg-opsnav" style="margin:-4px 0 12px">
  <a class="sg-chip {{ 'sg-chip--active' if active=='board' }}" href="{{ url_for('ops.board') }}">🛰 Пульт</a>
  <a class="sg-chip {{ 'sg-chip--active' if active=='conversions' }}" href="{{ url_for('ops.board_conversions') }}">Воронка / конверсии</a>
  <a class="sg-chip {{ 'sg-chip--active' if active=='calls' }}" href="{{ url_for('ops.calls') }}">📞 Звонки</a>
  <a class="sg-chip {{ 'sg-chip--active' if active=='payback' }}" href="{{ url_for('ops.payback') }}">Окупаемость</a>
  <a class="sg-chip {{ 'sg-chip--active' if active=='costs' }}" href="{{ url_for('ops.costs') }}">Затраты</a>
  <a class="sg-chip {{ 'sg-chip--active' if active=='plans' }}" href="{{ url_for('ops.plans') }}">Планы</a>
  <a class="sg-chip {{ 'sg-chip--active' if active=='absences' }}" href="{{ url_for('ops.absences') }}">Отсутствия</a>
  <a class="sg-chip {{ 'sg-chip--active' if active=='funnel' }}" href="{{ url_for('ops.funnel') }}">Маппинг воронки</a>
  <a class="sg-chip {{ 'sg-chip--active' if active=='validation' }}" href="{{ url_for('ops.validation') }}">Валидация</a>
</div>
<style>
  .sg-opsnav .sg-chip{display:inline-block;padding:3px 10px;margin:0 6px 6px 0;border-radius:999px;
    border:1px solid rgba(255,255,255,.12);text-decoration:none;color:inherit}
  .sg-opsnav .sg-chip--active{background:var(--sg-blue,#1467F5);border-color:transparent;color:#fff}
</style>
{% endmacro %}
