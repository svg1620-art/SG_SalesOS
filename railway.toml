# Railway config для SG_SalesOS.
# ВАЖНО: регион проекта — EU (обязательно для доступа к Anthropic API).
# Регион и Volume (/data) настраиваются в UI Railway, здесь — сборка/запуск.

[build]
builder = "NIXPACKS"

[deploy]
# Один старт-скрипт для обоих сервисов (web и worker) — ветвится по SCHEDULER_ROLE.
# web: миграции + gunicorn (1 воркер + потоки, чтобы amo_poll не задвоился).
# worker: python worker.py (фоновый планировщик; healthcheck проходит мини-сервером).
startCommand = "bash start.sh"
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
